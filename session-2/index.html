<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pinehill Quest</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div id="game">
      <h1 id="title">Pinehill Quest</h1>

      <!-- The HUD ("heads-up display") shows the hero's stats -->
      <div id="hud">
        <span id="hearts">❤️❤️❤️❤️❤️</span>
        <span id="gems">💎 0</span>
      </div>

      <!-- game.js draws the map in here -->
      <div id="board"></div>

      <p id="message">Use the arrow keys to explore.</p>
    </div>

    <!-- world.js first (the data), then game.js (the rules) -->
    <script src="world.js"></script>
    <script src="game.js"></script>
  </body>
</html>
