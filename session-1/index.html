<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pinehill Quest</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div id="game">
      <h1>Pinehill Quest</h1>

      <!-- The HUD ("heads-up display") shows the hero's stats -->
      <div id="hud">
        <span id="hearts">❤️❤️❤️❤️❤️</span>
        <span id="gems">💎 0</span>
      </div>

      <!-- The map: 6 rows of 6 tiles -->
      <div id="board">
        <!-- Row 1 -->
        <div class="tile">🌲</div>
        <div class="tile">🌲</div>
        <div class="tile">🌲</div>
        <div class="tile">🌲</div>
        <div class="tile">🌲</div>
        <div class="tile">🌲</div>
        <!-- Row 2 -->
        <div class="tile">🌲</div>
        <div class="tile">🧝</div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile" id="chest">📦</div>
        <div class="tile">🌲</div>
        <!-- Row 3 -->
        <div class="tile">🌲</div>
        <div class="tile"></div>
        <div class="tile">🧙</div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile">🌲</div>
        <!-- Row 4 -->
        <div class="tile">🌲</div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile"></div>
        <div class="tile">🏪</div>
        <div class="tile">🌲</div>
        <!-- Row 5 -->
        <div class="tile">🌲</div>
        <div class="tile">🌊</div>
        <div class="tile">🌊</div>
        <div class="tile"></div>
        <div class="tile">🏠</div>
        <div class="tile">🌲</div>
        <!-- Row 6 -->
        <div class="tile">🌲</div>
        <div class="tile">🌲</div>
        <div class="tile">🌲</div>
        <div class="tile">🌲</div>
        <div class="tile">🌲</div>
        <div class="tile">🌲</div>
      </div>

      <p id="message">Click the treasure chest!</p>
    </div>

    <!-- Load JavaScript last, so the page is ready first -->
    <script src="game.js"></script>
  </body>
</html>
